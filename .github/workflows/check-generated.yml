name: Check generated guidance

on:
  pull_request:
    paths:
      - 'components/**'
      - 'docs/guidance/**'
      - 'llms.txt'
      - 'scripts/build-guidance.ts'
      - 'scripts/lib/**'

permissions:
  contents: read

jobs:
  guidance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2

      - name: Install dependencies
        run: npm ci

      - name: Check guidance covers every component
        run: npm run build-guidance -- --check
