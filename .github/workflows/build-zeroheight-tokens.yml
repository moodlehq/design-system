name: Build tokens for ZeroHeight token PRs

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  build-tokens:
    if: startsWith(github.event.pull_request.head.ref, 'zeroheight-tokens-')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.2

      - name: Install dependencies
        run: npm ci

      - name: Build tokens
        run: npm run build-tokens

      - name: Commit generated CSS/SCSS if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tokens/css tokens/scss
          if git diff --cached --quiet; then
            echo "No generated token changes to commit."
          else
            git commit -m "chore(tokens): Regenerate CSS/SCSS from updated DTCG tokens"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
