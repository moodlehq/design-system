name: Check Code Connect

on:
  pull_request:
    paths:
      - 'components/**'
      - 'figma.config.json'
      - 'scripts/check-code-connect.ts'

permissions:
  contents: read

jobs:
  code-connect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2

      - name: Install dependencies
        run: npm ci

      - name: Check Code Connect, stories and guidance for every component
        run: npm run check-code-connect
