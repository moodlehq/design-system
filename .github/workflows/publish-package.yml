name: Publish Package
on:
  push:
    tags:
      - 'design-system-v*'
permissions:
  contents: read # Set top-level permissions to read only
jobs:
  publish:
    permissions:
      id-token: write # Required for OIDC
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          registry-url: 'https://registry.npmjs.org' # required for npm to attempt OIDC trusted publishing

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build the package
        run: |
          npm run build --if-present

      # Trusted publishing (OIDC) requires npm CLI >= 11.5.1; the version bundled with Node 22.22.2 is older.
      # Run a newer npm via npx rather than upgrading the global npm in place, which fails with MODULE_NOT_FOUND.
      - name: Publish package
        run: npx --yes npm@^11.5.1 publish

      - name: Sync CHANGELOG to Confluence
        env:
          CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
          CONFLUENCE_PAGE_ID: ${{ secrets.CONFLUENCE_PAGE_ID }}
          CONFLUENCE_USER: ${{ secrets.CONFLUENCE_USER }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
        run: npx tsx scripts/sync-changelog.ts

      - name: Sync release matrix to Confluence
        env:
          CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
          CONFLUENCE_RELEASES_PAGE_ID: ${{ secrets.CONFLUENCE_RELEASES_PAGE_ID }}
          CONFLUENCE_USER: ${{ secrets.CONFLUENCE_USER }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
        run: npx tsx scripts/sync-releases.ts
