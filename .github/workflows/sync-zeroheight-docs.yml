name: Sync ZeroHeight design system docs

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.2

      - name: Install dependencies
        run: npm ci

      - name: Generate optional full-text export (llms-full.txt)
        run: npm run build-docs
        env:
          ZEROHEIGHT_MCP_URL: ${{ secrets.ZEROHEIGHT_MCP_URL }}

      - name: Generate per-component agent guidance
        run: npm run build-guidance
        env:
          ZEROHEIGHT_MCP_URL: ${{ secrets.ZEROHEIGHT_MCP_URL }}

      - name: Open pull request if file changed
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: 'chore: Regenerate agent guidance from ZeroHeight'
          branch: auto/sync-zeroheight-docs
          delete-branch: true
          title: 'chore: Sync ZeroHeight design system docs'
          body: |
            Auto-generated by the **Sync ZeroHeight design system docs** workflow.

            Regenerates `docs/guidance/**`, `llms.txt`, `llms-full.txt` and `AGENTS.md` from the
            live ZeroHeight styleguide at https://design.moodle.com/. Generated files are collapsed
            in the diff. Check the wording changes in `docs/guidance/components/*.md`.
          labels: |
            documentation
            automated
